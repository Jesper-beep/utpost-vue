name: utpost
services:
  postgres:
    container_name: utpost-db
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: utpost-api
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set in .env}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    container_name: utpost-client
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:4000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api

  web:
    container_name: utpost-web
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
