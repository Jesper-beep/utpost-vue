name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  quality:
    name: SlopChecker2000
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7
      - name: Installera Node
        uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - name: Installera beroendena
        run: npm ci
      - name: Kontrollera kod och formatering med Biome
        run: npm exec -- biome ci --error-on-warnings
      - name: Kontrollera markdown i dokumenten
        run: npm run lint:md
      - name: Kontrollera stavning
        run: npm run lint:spelling
      - name: Kontrollera typer
        run: npm run typecheck
      - name: Kör klientens tester
        run: npm test
      - name: Installera bildfunktionens beroenden
        run: npm --prefix functions ci
      - name: Kör bildfunktionens tester
        run: npm --prefix functions test
      - name: Bygg klienten
        run: npm run build

  security:
    name: Säkerhet
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: admin
      POSTGRES_DB: utpost
      MONGO_USER: admin
      MONGO_DB: utpost
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7
      - name: Skapa slumpade engångslösenord
        uses: ./.github/actions/ci-secrets

      - name: Kontrollera beroendena med npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Skanna repot med Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Bygg och starta API:et, klienten och databaserna med Docker Compose
        run: docker compose up -d --build --wait
      - name: Vänta tills API:et svarar genom nginx
        run: curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3001/api/health
      - name: Kontrollera att X-Powered-By bara är Shrek
        run: |
          for URL in http://localhost:3001/ http://localhost:3001/api/health; do
            VALUES=$(curl -sI "$URL" | grep -i '^x-powered-by:' | tr -d '\r')
            [ "$VALUES" = "X-Powered-By: Shrek" ] || { echo "Oväntad header från $URL: $VALUES"; exit 1; }
          done

      - name: Skanna API-avbildningen med Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: utpost-api
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Skanna klientens avbildning med Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: utpost-client
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Skanna sajten med ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: http://localhost:3001
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false

  integration:
    name: Integrationstester
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: admin
      POSTGRES_DB: utpost
      MONGO_USER: admin
      MONGO_DB: utpost
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7
      - name: Skapa slumpade engångslösenord
        uses: ./.github/actions/ci-secrets
      - name: Skapa adresser till databaserna
        run: |
          echo "POSTGRES_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5433/${POSTGRES_DB}" >> "$GITHUB_ENV"
          echo "MONGODB_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@localhost:27017/${MONGO_DB}?authSource=admin" >> "$GITHUB_ENV"
      - name: Starta Postgres och MongoDB med Docker Compose
        run: docker compose up -d --wait postgres mongo
      - name: Installera Node
        uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - name: Installera beroendena
        run: npm ci
      - name: Fyll Postgres med testdata
        run: npm run seed
      - name: Flytta turloggarna till MongoDB
        run: npm run migrate:logs
      - name: Kör API:ets integrationstester
        run: npm run test:api

  image:
    name: Docker-avbildningar
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7
      - name: Förbered Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Logga in i GitHub Container Registry
        uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-api
        name: Skapa taggar och etiketter för API-avbildningen
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Bygg API-avbildningen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - id: meta-client
        name: Skapa taggar och etiketter för klientens avbildning
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-client
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Bygg klientens avbildning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: client/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    name: Deploy to Azure staging
    runs-on: ubuntu-latest
    needs: [image, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: azure-staging
      url: ${{ vars.AZURE_URL }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Logga in i Azure med GitHubs identitet (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Byt image på api och client, exakt den här committen
        env:
          RG: ${{ secrets.AZURE_RG }}
          APP: ${{ vars.AZURE_APP }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          REPO="${GITHUB_REPOSITORY,,}"
          TAG="sha-${GITHUB_SHA::7}"
          az containerapp update --name "$APP" --resource-group "$RG" \
            --container-name api --image "ghcr.io/${REPO}-api:${TAG}" \
            --revision-suffix "${TAG}-api" --output none
          az containerapp update --name "$APP" --resource-group "$RG" \
            --container-name client --image "ghcr.io/${REPO}-client:${TAG}" \
            --revision-suffix "${TAG}" \
            --query properties.latestRevisionName --output tsv

      - name: Vänta tills staging kör den här committen
        env:
          URL: ${{ vars.AZURE_URL }}
          RG: ${{ secrets.AZURE_RG }}
          APP: ${{ vars.AZURE_APP }}
        run: |
          URL="${URL%/}"
          TAG="sha-${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS --max-time 20 "$URL/api/health" 2>/dev/null | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p' || true)
            REV=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestReadyRevisionName --output tsv 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ] && [ "${REV##*--}" = "$TAG" ]; then
              echo "OK: $URL kör $GITHUB_SHA (revision $REV)"
              exit 0
            fi
            echo "Försök $i/30: staging kör ${LIVE:-(inget svar ännu, appen väcks från noll?)}, klar revision ${REV:-?}, väntar 10 s"
            sleep 10
          done
          echo "::error::Staging kör inte $GITHUB_SHA efter 5 minuter. Kolla Revisions and replicas i portalen, eller az containerapp logs show --container api."
          exit 1

      - name: Röktest av GraphQL genom nginx-proxyn
        env:
          URL: ${{ vars.AZURE_URL }}
        run: |
          URL="${URL%/}"
          SVAR=$(curl -fsS --max-time 20 "$URL/graphql" -H 'Content-Type: application/json' \
            -d '{"query":"{ tours(limit: 1) { id user { displayName } } }"}')
          echo "$SVAR"
          echo "$SVAR" | grep -q '"displayName"' || { echo "::error::GraphQL svarade utan data"; exit 1; }
          echo "OK: /graphql svarar via nginx, med data ur en seedad databas"

  functions:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: azure-staging
      url: ${{ vars.AZURE_URL }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-functions
      cancel-in-progress: false
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7
      - name: Installera Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Bygg funktionen
        run: |
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Paketera med bara det som körs i Azure
        run: |
          mkdir package
          cp functions/package.json functions/package-lock.json functions/host.json package/
          cp -R functions/dist package/dist
          npm --prefix package ci --omit=dev

      - name: Logga in i Azure med GitHubs identitet (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publicera funktionen
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP }}
          package: package

      - name: Röktest, funktionen svarar och nyckeln fungerar
        env:
          RG: ${{ secrets.AZURE_RG }}
          FUNCTION_APP: ${{ vars.AZURE_FUNCTION_APP }}
        run: |
          KEY=$(az functionapp keys list --name "$FUNCTION_APP" --resource-group "$RG" \
            --query functionKeys.default --output tsv)
          echo "::add-mask::$KEY"
          HOST=$(az resource show --name "$FUNCTION_APP" --resource-group "$RG" \
            --resource-type Microsoft.Web/sites --query properties.defaultHostName --output tsv)
          for i in $(seq 1 12); do
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 -X POST \
              -H "x-functions-key: $KEY" -H 'Content-Type: image/jpeg' \
              --data-binary 'det här är inte en bild' "https://${HOST}/api/process-image" || true)
            if [ "$STATUS" = "400" ]; then
              echo "OK: funktionen svarar 400 på data som inte är en bild, alltså körs koden"
              exit 0
            fi
            echo "Försök $i/12: status ${STATUS:-inget svar}, väntar 10 s"
            sleep 10
          done
          echo "::error::Funktionen svarade inte 400 på data som inte är en bild. Kolla Log stream eller Deployment Center i portalen."
          exit 1
