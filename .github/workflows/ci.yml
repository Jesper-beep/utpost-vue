name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  quality:
    name: SlopChecker2000
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm exec -- biome ci --error-on-warnings
      - run: npm run lint:md
      - run: npm run lint:spelling
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: utpost
          POSTGRES_PASSWORD: utpost
          POSTGRES_DB: utpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utpost -d utpost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongo:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: utpost
          MONGO_INITDB_ROOT_PASSWORD: utpost
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JWT_SECRET: ci-only-secret
      MONGODB_URL: mongodb://utpost:utpost@localhost:27017/utpost?authSource=admin
      POSTGRES_URL: postgres://utpost:utpost@localhost:5432/utpost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run seed
      - run: npm run migrate:logs
      - run: npm run test:api

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - id: meta-client
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-client
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: client/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    name: Deploy to Azure staging
    runs-on: ubuntu-latest
    needs: [image, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: azure-staging
      url: ${{ vars.AZURE_URL }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Logga in i Azure med GitHubs identitet (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Byt image på api och client, exakt den här committen
        env:
          RG: ${{ secrets.AZURE_RG }}
          APP: ${{ vars.AZURE_APP }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          REPO="${GITHUB_REPOSITORY,,}"
          TAG="sha-${GITHUB_SHA::7}"
          az containerapp update --name "$APP" --resource-group "$RG" \
            --container-name api --image "ghcr.io/${REPO}-api:${TAG}" \
            --revision-suffix "${TAG}-api" --output none
          az containerapp update --name "$APP" --resource-group "$RG" \
            --container-name client --image "ghcr.io/${REPO}-client:${TAG}" \
            --revision-suffix "${TAG}" \
            --query properties.latestRevisionName --output tsv

      - name: Vänta tills staging kör den här committen
        env:
          URL: ${{ vars.AZURE_URL }}
          RG: ${{ secrets.AZURE_RG }}
          APP: ${{ vars.AZURE_APP }}
        run: |
          URL="${URL%/}"
          TAG="sha-${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS --max-time 20 "$URL/api/health" 2>/dev/null | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p' || true)
            REV=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestReadyRevisionName --output tsv 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ] && [ "${REV##*--}" = "$TAG" ]; then
              echo "OK: $URL kör $GITHUB_SHA (revision $REV)"
              exit 0
            fi
            echo "Försök $i/30: staging kör ${LIVE:-(inget svar ännu, appen väcks från noll?)}, klar revision ${REV:-?}, väntar 10 s"
            sleep 10
          done
          echo "::error::Staging kör inte $GITHUB_SHA efter 5 minuter. Kolla Revisions and replicas i portalen, eller az containerapp logs show --container api."
          exit 1

      - name: Röktest av GraphQL genom nginx-proxyn
        env:
          URL: ${{ vars.AZURE_URL }}
        run: |
          URL="${URL%/}"
          SVAR=$(curl -fsS --max-time 20 "$URL/graphql" -H 'Content-Type: application/json' \
            -d '{"query":"{ tours(limit: 1) { id user { displayName } } }"}')
          echo "$SVAR"
          echo "$SVAR" | grep -q '"displayName"' || { echo "::error::GraphQL svarade utan data"; exit 1; }
          echo "OK: /graphql svarar via nginx, med data ur en seedad databas"
