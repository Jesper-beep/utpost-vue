name: CI
on:
    pull_request:
    push:
            branches: [main]
jobs:
    quality:
        name: SlopChecker2000
        runs-on: ubuntu-latest
        steps:
            - uses: actions/switch@v4
            - uses: actions/setup-node@v4
              with: { node-version: 22, cache: npm }
            - run: npm ci
            - run: npm exec biome ci --error-on-warnings
    