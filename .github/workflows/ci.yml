name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  quality:
    name: SlopChecker2000
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm exec -- biome ci --error-on-warnings
      - run: npm run lint:md
      - run: npm run lint:spelling
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
